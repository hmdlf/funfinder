name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: funfinder
          POSTGRES_PASSWORD: funfinder
          POSTGRES_DB: funfinder_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U funfinder"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      AIRFLOW_VERSION: "3.3.2"
      PYTHON_VERSION: "3.12"
      AIRFLOW_HOME: /tmp/airflow
      FUNFINDER_TEST_DSN: postgresql://funfinder:funfinder@localhost:5432/funfinder_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        run: |
          pip install "apache-airflow[postgres]==${AIRFLOW_VERSION}" -r requirements.txt ruff \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest -q
