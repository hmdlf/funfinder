# Источники событий Липецка.
# Новый город — новый файл рядом, с тем же форматом.

city:
  slug: lipetsk            # пойдёт в URL сайта: /lipetsk/
  name: Липецк
  timezone: Europe/Moscow
  language: ru

# Публичные сообщества VK. handle — короткое имя из адреса:
# vk.com/lipetsk_afisha → lipetsk_afisha, vk.com/club12345 → club12345.
# Можно вставить и ссылку целиком, она нормализуется.
#
# settings — необязательные настройки загрузки для конкретного паблика:
#   initial_lookback_days: 30   за сколько дней брать посты при первой загрузке
#   recheck_days: 7             сколько последних дней перепроверять на правки
#   max_pages: 10               максимум страниц по 100 постов за запуск
#   wall_filter: owner          owner — только посты сообщества, all — и посты людей
#
# venue — площадка по умолчанию, slug из venues/lipetsk.yaml. Для пабликов
# самих площадок: если модель не нашла место или написала «малый зал»,
# событие привязывается к этой площадке.
vk:
#  - handle: example_public
#    note: Афиша площадки X
#  - handle: https://vk.com/club12345
#    note: Настолки
#    settings:
#      initial_lookback_days: 60
- handle: club221125269
  note: Культ-клуб «Атмосфера» / Липецк
  venue: atmosfera
- handle: club51369142
  note: Афиша Липецк
- handle: club154441145
  note: Галерея современного искусства «Буксир»
  venue: buksir
- handle: club216293636
  note: Прачечная | учреждение культуры | Липецк
  venue: prachechnaya
- handle: 185616166
  note: Библиотека | Липецк
- handle: 217225844
  note: Вау Квиз Липецк | Тематическая игра


# Публичные каналы Telegram. Читаются через веб-версию t.me/s/<канал>, без
# аккаунта и ключей. Из России t.me не открывается — см. README, «Telegram».
# handle — имя канала или ссылка (https://t.me/sinitsabar, @sinitsabar).
# Настройки (settings) те же по смыслу, что у VK: initial_lookback_days,
# recheck_days, max_pages (страница — около 20 постов), page_delay_s.
tg:
- handle: sinitsabar
  note: Бар «Синица»
  venue: sinitsa

# Сайты площадок: афиша разбирается кодом из funfinder/sites/, без LLM.
# handle — домен; разбор для него должен быть в funfinder/sites/__init__.py.
# venue — площадка всех показов, settings.category — категория.
sites:
- handle: teatr-tolstogo.ru
  note: Театр драмы им. Толстого — страница афиши
  venue: teatr-dramy
  settings: {category: theatre}
- handle: teatr48.ru
  note: Театр «На Соколе» — календарь на главной
  venue: teatr-na-sokole
  settings: {category: theatre}
