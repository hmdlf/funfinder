# Площадки Липецка: как называть их на сайте и как их пишут в анонсах.
#
#   slug      постоянный ключ (a-z, 0-9, дефис). На него ссылаются источники
#             (venue: в sources/lipetsk.yaml), позже — адреса страниц площадок.
#   name      как показывать на сайте. Само название — тоже вариант написания.
#   address   адрес для сайта. Тоже участвует в поиске: «ул. Ленина, 31» без
#             названия найдёт библиотеку Бартенева.
#   aliases   другие варианты написания. Сравниваются по основам слов, без
#             регистра, кавычек, «ул.» и инициалов, поэтому «Есенин» покрывает и
#             «Есенинская библиотека», и «библиотека им. С. А. Есенина».
#             Вариант подходит, если все его слова есть в тексте места.
#
# После правки справочника: ingest_vk перенесёт его в базу при следующем
# запуске (или запустите ingest_vk вручную), затем process_events
# с параметром «Пересобрать каталог» — чтобы старые события тоже привязались.
# Что ещё не привязано: SELECT * FROM staging.unmatched_venues ORDER BY mentions DESC;

