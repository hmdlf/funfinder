# nginx для matingu.com. Положить в /etc/nginx/sites-available/matingu.com,
# включить ссылкой в sites-enabled. HTTPS и редирект с http допишет certbot:
#   sudo certbot --nginx -d matingu.com -d www.matingu.com --redirect

# www.matingu.com → matingu.com
server {
    listen 80;
    listen [::]:80;
    server_name www.matingu.com;
    return 301 $scheme://matingu.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name matingu.com;

    # current — ссылка на последнюю выложенную версию (её переключает deploy_site).
    root /var/www/matingu/current;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    # Страницы меняются при каждой сборке — браузер должен перепроверять их.
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # Стили и скрипт подключаются с ?v=<хеш>, шрифты не меняются — кешируем надолго.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/xml image/svg+xml text/plain;
}
