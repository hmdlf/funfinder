# FunFinder: Airflow 3 (LocalExecutor) + PostgreSQL.
#
# Один контейнер Postgres, две базы:
#   airflow   — метаданные Airflow (его внутренности, руками не трогаем);
#   funfinder — данные проекта (raw / staging / catalog / quarantine / meta).
#
# Все порты привязаны к 127.0.0.1: даже на VPS UI не торчит наружу,
# заходить через SSH-туннель. Авторизации в UI нет (SimpleAuthManager,
# все — админы), поэтому открывать порт наружу нельзя.
#
# Запуск: см. README.md («Быстрый старт»).

x-airflow-common: &airflow-common
  build: .
  image: funfinder-airflow:latest
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?запустите python scripts/init_env.py}
    # Общий секрет всех компонентов. Пустой нельзя: каждый процесс придумает
    # свой, и задачи будут падать с ошибкой подписи токена.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?запустите python scripts/init_env.py}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Moscow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Код проекта (src/funfinder) импортируется из DAG-ов и тестов.
    PYTHONPATH: /opt/airflow/src
    # Подключение к базе проекта. Хук в DAG-ах: PostgresHook("funfinder_db").
    AIRFLOW_CONN_FUNFINDER_DB: postgresql://${FUNFINDER_DB_USER}:${FUNFINDER_DB_PASSWORD}@postgres:5432/funfinder
    # Секреты как переменные Airflow: в UI они не видны, в базе не хранятся.
    AIRFLOW_VAR_VK_SERVICE_TOKEN: ${VK_SERVICE_TOKEN}
    AIRFLOW_VAR_YANDEX_API_KEY: ${YANDEX_API_KEY}
    AIRFLOW_VAR_YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID}
    # Сайт: адрес и куда выкладывать. Пустой SITE_DEPLOY_HOST — сайт собирается только локально.
    AIRFLOW_VAR_SITE_URL: ${SITE_URL:-https://matingu.com}
    AIRFLOW_VAR_SITE_CONTACT: ${SITE_CONTACT:-}
    AIRFLOW_VAR_SITE_DEPLOY_HOST: ${SITE_DEPLOY_HOST:-}
    AIRFLOW_VAR_SITE_DEPLOY_USER: ${SITE_DEPLOY_USER:-deploy}
    AIRFLOW_VAR_SITE_DEPLOY_DIR: ${SITE_DEPLOY_DIR:-/var/www/matingu}
    # Telegram: из России t.me не открывается — true значит «загружать через сервер сайта по SSH».
    AIRFLOW_VAR_TG_FETCH_VIA_SSH: ${TG_FETCH_VIA_SSH:-false}
    FUNFINDER_SOURCES_DIR: /opt/airflow/sources
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./sources:/opt/airflow/sources
    - ./tests:/opt/airflow/tests
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
    - ./plugins:/opt/airflow/plugins
    - ./site_build:/opt/airflow/site_build       # собранный сайт: site_build/site
    - ./secrets:/opt/airflow/secrets:ro          # ключ деплоя и known_hosts сервера
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
      FUNFINDER_DB_USER: ${FUNFINDER_DB_USER}
      FUNFINDER_DB_PASSWORD: ${FUNFINDER_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Создаёт базы funfinder и funfinder_test. Выполняется только
      # при первом запуске, пока том postgres-data пуст.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      # 5433, а не 5432, чтобы не конфликтовать с локальным Postgres.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # Миграции метабазы Airflow и права на смонтированные папки.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/config /opt/airflow/plugins
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs /opt/airflow/config /opt/airflow/plugins
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
    user: "0:0"

  # Миграции базы проекта (src/funfinder/db/migrations/*.sql).
  funfinder-migrate:
    <<: *airflow-common
    command: ["python", "-m", "funfinder.db.migrate"]
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      funfinder-migrate:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Для разовых команд: docker compose run --rm airflow-cli <команда>
  airflow-cli:
    <<: *airflow-common
    profiles: ["cli"]
    environment:
      <<: *airflow-common-env
      FUNFINDER_TEST_DSN: postgresql://${FUNFINDER_DB_USER}:${FUNFINDER_DB_PASSWORD}@postgres:5432/funfinder_test
    command: ["bash"]

volumes:
  postgres-data:
